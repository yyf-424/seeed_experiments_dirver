# ============================================================================
# b601_project.yaml —— B601_example 全项目唯一参数真值（single source of truth）
#
# 规矩（改之前先读）：
#   1. 「关节限位 / 电机参数 / 启动姿态 / 控制器 / 规划限速 / 安全阈值」只允许在这里改。
#   2. 改完必须跑：  ./scripts/sync_config.py          （生成所有派生文件）
#      再跑：        ./scripts/verify.sh              （一致性检查会挡下没同步的状态）
#   3. 下游文件带 "DO NOT EDIT" 标记，由脚本生成，手改会被下一次 sync 覆盖。
#   4. xacro（URDF / ros2_control 接口）在运行时**直接读本文件**，不生成中间产物，
#      所以只要本文件变了，模型立刻跟着变。
#
# 谁读这份配置：
#   b601_description/urdf/inc/b601_links.xacro        关节 limit（lower/upper/effort/velocity）
#   b601_description/urdf/inc/ros2_control.xacro      命令/状态接口 + 真机电机参数 + 软限位
#   b601_bringup/config/b601_controllers.yaml          [生成] 控制器
#   b601_moveit_config/config/joint_limits.yaml        [生成] MoveIt 速度/加速度限制
#   b601_description/config/initial_positions.yaml     [生成] 上电/启动姿态
#   b601_safety/config/safety_params.yaml              [生成] 安全监控节点参数
#   b601_demos/b601_demos/trajectory_utils.py          运行时读 joints 限位做越界拒发
# ============================================================================

meta:
  version: 1
  updated: "2026-11-21"
  note: >
    改任何限位/增益/阈值之前，先想清楚它属于哪一层：模型事实放 joints，
    控制器行为放 controllers，安全策略放 safety，规划器速度放 moveit。

# ---------------------------------------------------------------------------
# 机器人整体
# ---------------------------------------------------------------------------
robot:
  name: b601_dm
  # ros2_control 的 <ros2_control name="...">，也是 set_hardware_component_state 的服务参数
  ros2_control_name: b601
  # 六轴手臂关节（顺序 = 轨迹数组顺序 = MoveIt 规划组顺序）
  arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  gripper_joint: finger_left
  mimic_joint: finger_right

# ---------------------------------------------------------------------------
# 关节：物理事实（URDF 限位）+ 电机映射（真机后端）+ 启动姿态
#
#   min_pos / max_pos     URDF limit 与 ros2_control 软限位，一改全改
#   max_velocity          关节单位（rad/s 或 m/s），用于命令限速和 MoveIt 时间参数化
#   max_motor_torque_nm   电机侧力矩上限（N·m）；URDF 按关节单位换算
#   startup               上电/启动姿态（mock 初值 + 真机"以为在哪儿" + 安全节点警告基线）
#   motor.*               仅 hardware:=dm 生效；scale 把电机 rad 换成关节单位
#   control               false = 没有命令接口（mimic 从动指）
#
# 限位原则（2026-11-21 更新）：**上下限一律取保守值** = 官方值与 2026-11-20 手推实测值取交集
#   · joint1: 实测 −2.597/+2.627 → 取 [−2.59, +2.60]（官方 ±2.8 越过停止位）
#   · joint2/3: 实测下限 −3.436/−3.926 比官方 −3.14 更远 → 保留 −3.14（窄的一侧）
#   · joint4: 实测 −1.560/+2.275 → 取 [−1.56, +1.57]
#   · joint5: 实测 −0.730/+1.800 → 下限收到 −0.73（原来是 −1.57，比实测宽 0.84 ≈ 48°）
#   · joint6/夹爪: 沿用更窄的一侧
# 角速度（2026-11-21 按需求放宽）：joint1..6 统一 6.0 rad/s；夹爪 0.05 m/s 不变。
#   ⚠ 安全节点的急停线 = max_velocity → 现在 joint1..6 都是 6.0 rad/s，
#     警告线 4.8 rad/s。放宽速度就放宽了急停门限，这是刻意的取舍，别再回头当成 bug。
# ---------------------------------------------------------------------------
joints:
  joint1:
    label: 底座回转
    type: revolute
    min_pos: -2.59
    max_pos: 2.60
    max_velocity: 6.0
    # 反馈跳变门限（rad/周期）：钉死它，放宽角速度时守卫不跟着放松
    feedback_jump_limit: 0.21
    max_motor_torque_nm: 24.0
    startup: 0.0
    control: true
    motor:
      id: 1
      feedback_id: 17
      model: "4340P"
      direction: 1.0
      scale: 1.0
      # 关节 effort ↔ 电机力矩换算（revolute=1.0；prismatic=等效齿轮半径 m）
      effort_scale: 1.0
      zero_offset: 0.0
      kp: 120.0
      kd: 8.0

  joint2:
    label: 大臂抬起
    type: revolute
    min_pos: -3.14
    max_pos: 0.0
    # 2026-11-25 电机置零后的指令校准正端。急停测量快照保留在 safety.angle。
    calibrated_command_max_pos: 0.0
    max_velocity: 6.0
    # 反馈跳变门限（rad/周期）：钉死它，放宽角速度时守卫不跟着放松
    feedback_jump_limit: 0.21
    max_motor_torque_nm: 24.0
    startup: -0.3
    control: true
    motor:
      id: 2
      feedback_id: 18
      model: "4340P"
      direction: 1.0
      scale: 1.0
      # 关节 effort ↔ 电机力矩换算（revolute=1.0；prismatic=等效齿轮半径 m）
      effort_scale: 1.0
      zero_offset: 0.0
      kp: 120.0
      kd: 8.0

  joint3:
    label: 小臂肘
    type: revolute
    min_pos: -3.14
    max_pos: 0.0
    max_velocity: 6.0
    # 反馈跳变门限（rad/周期）：钉死它，放宽角速度时守卫不跟着放松
    feedback_jump_limit: 0.21
    max_motor_torque_nm: 24.0
    startup: -0.6
    control: true
    motor:
      id: 3
      feedback_id: 19
      model: "4340P"
      direction: 1.0
      scale: 1.0
      # 关节 effort ↔ 电机力矩换算（revolute=1.0；prismatic=等效齿轮半径 m）
      effort_scale: 1.0
      zero_offset: 0.0
      kp: 120.0
      kd: 8.0

  joint4:
    label: 腕部回转
    type: revolute
    min_pos: -1.56
    max_pos: 1.57
    max_velocity: 6.0
    # 反馈跳变门限（rad/周期）：钉死它，放宽角速度时守卫不跟着放松
    feedback_jump_limit: 0.37
    max_motor_torque_nm: 10.0
    startup: 0.0
    control: true
    motor:
      id: 4
      feedback_id: 20
      model: "4310"
      direction: 1.0
      scale: 1.0
      # 关节 effort ↔ 电机力矩换算（revolute=1.0；prismatic=等效齿轮半径 m）
      effort_scale: 1.0
      zero_offset: 0.0
      kp: 18.0
      kd: 2.0

  joint5:
    label: 腕部俯仰
    type: revolute
    min_pos: -0.73
    max_pos: 1.57
    max_velocity: 6.0
    # 反馈跳变门限（rad/周期）：钉死它，放宽角速度时守卫不跟着放松
    feedback_jump_limit: 0.37
    max_motor_torque_nm: 10.0
    startup: 0.0
    control: true
    motor:
      id: 5
      feedback_id: 21
      model: "4310"
      direction: 1.0
      scale: 1.0
      # 关节 effort ↔ 电机力矩换算（revolute=1.0；prismatic=等效齿轮半径 m）
      effort_scale: 1.0
      zero_offset: 0.0
      kp: 18.0
      kd: 2.0

  joint6:
    label: 末端自转
    type: revolute
    min_pos: -3.14
    max_pos: 3.14
    max_velocity: 6.0
    # 反馈跳变门限（rad/周期）：钉死它，放宽角速度时守卫不跟着放松
    feedback_jump_limit: 0.37
    max_motor_torque_nm: 10.0
    startup: 0.0
    control: true
    motor:
      id: 6
      feedback_id: 22
      model: "4310"
      direction: 1.0
      scale: 1.0
      # 关节 effort ↔ 电机力矩换算（revolute=1.0；prismatic=等效齿轮半径 m）
      effort_scale: 1.0
      zero_offset: 0.0
      kp: 18.0
      kd: 2.0

  # 主动指：prismatic，单位米。电机转 rad → 关节走 m，scale = 0.01 m/rad
  finger_left:
    label: 夹爪主动指
    type: prismatic
    # 夹爪开合是正常操作：不产生"接近限位/离开启动位形"警告，但越限照样急停
    warn_near_limit: false
    warn_pose_deviation: false
    warn_pos_margin: 0.005
    min_pos: 0.0
    max_pos: 0.05
    max_velocity: 0.05
    # 反馈跳变门限（rad/周期）：钉死它，放宽角速度时守卫不跟着放松
    feedback_jump_limit: 0.05
    max_motor_torque_nm: 10.0
    startup: 0.0
    control: true
    motor:
      id: 7
      feedback_id: 23
      model: "4310"
      direction: -1.0
      scale: 0.01
      # 关节 effort ↔ 电机力矩换算（revolute=1.0；prismatic=等效齿轮半径 m）
      effort_scale: 0.01
      zero_offset: 0.0
      kp: 8.0
      kd: 1.0

  # 从动指：URDF 里是 mimic（multiplier=-1），没有命令接口，只有状态
  finger_right:
    label: 夹爪从动指
    type: prismatic
    warn_near_limit: false
    warn_pose_deviation: false
    warn_pos_margin: 0.005
    min_pos: -0.05
    max_pos: 0.0
    max_velocity: 0.05
    # 反馈跳变门限（rad/周期）：钉死它，放宽角速度时守卫不跟着放松
    feedback_jump_limit: 0.05
    max_motor_torque_nm: 0.10  # 从动指的模型等效上限，使用主动指的传动比
    startup: 0.0
    control: false

# ---------------------------------------------------------------------------
# 硬件后端现场参数（hardware:=dm 时生效）
# 静态结构（几个关节、限位）在 joints 里；现场差异（串口、安全阀）在这里。
# ---------------------------------------------------------------------------
hardware:
  default_backend: mock          # mock | dm | mujoco（launch 的 hardware:= 可覆盖）
  dm:
    device: /dev/ttyACM0
    baudrate: 921600
    command_mode: pos_vel       # pos_vel | mit | mit_torque
    enable_motors: false        # ⚠ 安全总闸：false = 只读模式
    effort_sign: -1.0           # 力矩**反馈**：电机 torq 与关节正方向反号（实测）
    command_sign: 1.0           # 力矩**命令**：与关节正方向同号（实测；与 effort_sign 不同！）
                                # ⚠ 2026-11-21：曾把反馈的 -1 误用到命令上 → PD 正反馈，
                                #   真机首个 0.05 rad 动作 joint5 冲到 10.26 rad/s（被急停拦下）
    watchdog_timeout: 0.5       # 超时无新命令 → 原地保持
    can_timeout_ms: 0           # 电机侧 CAN 超时报警（0 = 不设）
    max_write_failures: 20      # 连续写失败这么多次即停用硬件
    feedback_wait_ms: 2000      # configure 阶段等首帧反馈上限
    # ---- CSV 记录（速度/MIT 数据留痕）----
    # 留空 = 关闭。填路径（如 .verify/run.csv）后，插件每采样周期写一行，包含
    # 电机原始 pos/vel/torq（**过滤前**）、过滤后的关节状态、以及命令值
    # （pos_vel/mit → 目标位置；mit_torque → 力矩命令）。用于事后分析"抽风"这类事件。
    log_csv: ""
    log_rate_hz: 200.0

    # ---- 温度守护（决策③：不做力矩位置保护，堵转靠温度兜底）----
    # 数据来自反馈帧自带的 t_mos / t_rotor；插件以前完全没读它们。
    # ⚠ 70/85 ℃ 是**保守占位值**，达妙规格书里没有查到官方上限（本地文档与官方 SDK 都没有），
    #   实测正常工况（空载 21–23 ℃）后再收紧；改这里即可，不用改代码。
    temperature:
      warn_c: 70.0          # 告警线：只报警 + 进日志/CSV，不动作
      limit_c: 85.0         # 超这条：立即 disable 整条总线 + 硬件置 error（锁存，需人工重启）
      hysteresis_c: 5.0     # 恢复要求降到 warn_c − 5 以下

    # 仿真后端（MujocoSystemHardware）的一阶热模型：让"持续大扭矩 → 过温失能"能在仿真里验
    thermal:
      ambient_c: 25.0
      heat_c_per_s: 1.5     # 满载（|τ|=torque_limit）时的升温速率
      cooling_tau_s: 60.0

    request_feedback: true      # 达妙是应答式：不发请求帧就收不到任何反馈
    feedback_divider: 1         # 每 N 个控制周期发一次请求帧（1 = 每周期）
    mode_switch_timeout_ms: 1000  # ensure_mode 的等待上限

# ---------------------------------------------------------------------------
# 控制器（ros2_control）
# 位置模式用 arm/gripper；力控模式用 mit。同一时刻只加载其中一套。
# ---------------------------------------------------------------------------
target_slew:
  revolute: 0.5   # rad/s
  prismatic: 0.5  # m/s

controllers:
  update_rate: 200

  joint_state_broadcaster:
    type: joint_state_broadcaster/JointStateBroadcaster
    params:
      use_local_topics: false

  arm:
    name: b601_arm_controller
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    params:
      allow_nonzero_velocity_at_trajectory_end: true
      allow_partial_joints_goal: false

  gripper:
    name: b601_gripper_controller
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [finger_left]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    params:
      allow_nonzero_velocity_at_trajectory_end: true
      allow_partial_joints_goal: true

  # 电机侧 MIT 使用一套纯 PD 与一套重力控制。重力控制内部按跟踪和保持切换。
  mit:
    update_rate: 200
    instances:
      b601_mit_arm:
        plugin: b601_mit_controller/B601MitController
        joints: [joint1, joint2, joint3, joint4, joint5, joint6]
        profile: arm_pure_pd
        gravity_profile: arm_gravity_pd
        chain_joints: [joint1, joint2, joint3, joint4, joint5, joint6]
      b601_mit_gripper:
        plugin: b601_mit_controller/B601MitController
        joints: [finger_left]
        profile: gripper_mit
        chain_joints: [joint1, joint2, joint3, joint4, joint5, joint6]

    profiles:
      arm_pure_pd:
        # v0.2.1 电机侧纯 PD，真机五姿态通过。
        per_joint:
          joint1: {kp_move: 115.0, kd_move: 5.0}
          joint2: {kp_move: 265.0, kd_move: 5.0}
          joint3: {kp_move: 190.0, kd_move: 5.0}
          joint4: {kp_move: 200.0, kd_move: 3.4}
          joint5: {kp_move: 36.0, kd_move: 1.2}
          joint6: {kp_move: 28.0, kd_move: 0.82}
        group: &arm_mit_group
          free_enabled: false
          settle_band_min: 0.01
          settle_band_max: 0.05
          settle_band_pct: 0.05
          settle_sec: 3.0
          kp_up_sec: 0.8
          kp_down_sec: 2.0
          q_ref_lpf_hz: 30.0
          track_timeout_sec: 0.0
          motor_impedance: true
          velocity_lpf_hz: 6.0
          gravity_scale: 0.0
          friction_scale: 0.0
          friction_vel_eps: 0.02
          use_gravity: false
          task_torque_timeout_sec: 0.5  # MIT 任务前馈沿用已有超时，位置目标继续有效。
          target_velocity_timeout_sec: 0.25
          state_interfaces: [position, velocity]

      arm_gravity_pd:
        # 跟踪沿用 J2–J5 重力补偿的低 Kd 实测档。保持增益由跟踪增益按比例生成。
        # 高低档使用同一辨识模型，保留各自实测时的逐轴补偿比例。
        hold_gain_ratios: {kp: 0.5, kd: 0.2}
        per_joint:
          joint1: {kp_move: 115.0, kd_move: 5.0, gravity_joint_scale: 0.0}
          joint2: {kp_move: 120.025, kd_move: 5.0, gravity_joint_scale: 1.0}
          joint3: {kp_move: 120.025, kd_move: 5.0, gravity_joint_scale: 1.0, settle_band_min: 0.03}
          joint4: {kp_move: 30.0, kd_move: 2.8, gravity_joint_scale: 1.0, settle_band_min: 0.02}
          joint5: {kp_move: 18.0, kd_move: 1.6, gravity_joint_scale: 1.0, settle_band_min: 0.02}
          joint6: {kp_move: 28.0, kd_move: 0.65, gravity_joint_scale: 0.0}
        group:
          <<: *arm_mit_group
          use_gravity: true
          gravity_scale: 1.0
          gravity_joint_scale_free: 1.0
          free_enabled: true
          free_follow_feedback: true
          low_after_first_target: true
          q_ref_lpf_hz: 0.0

      # 夹爪使用独立纯 PD。电机侧 Kp/Kd 为 6.0/1.2。
      gripper_mit:
        per_joint:
          finger_left: {kp_move: 60000.0, kd_move: 12000.0}
        group:
          <<: *arm_mit_group
          settle_band_min: 0.0005
          settle_band_max: 0.0025
          settle_sec: 2.0
          kp_up_sec: 0.5
          kp_down_sec: 1.0
          friction_vel_eps: 0.002

    # ---- 所有实例共用的东西（重力模型参数 = 整条链，与实例划分无关）----
    shared:
      # 8 个 link 的 [m, m*cx, m*cy, m*cz]，顺序 = b601_chain.hpp 的 kGravityLinks
      gravity_params: [1.326600, -0.124435, -0.086111, -0.040900,
                       0.821833, 0.070095, 0.029823, -0.025906,
                       0.494982, 0.061640, -0.024109, -0.015756,
                       0.360243, -0.013547, -0.007382, 0.017297,
                       0.343277, -0.002668, -0.000196, -0.002202,
                       0.475011, -0.048506, 0.000262, -0.002781,
                       0.025011, -0.011623, 0.000267, -0.002785,
                       0.025011, -0.011623, 0.000267, -0.002785]

# ---------------------------------------------------------------------------
# MoveIt 规划限速（时间参数化的依据）
# default_*_scaling 是教学默认：只用 20% 极限速度，便于观察
# ---------------------------------------------------------------------------
moveit:
  mit_trajectory_controller: b601_mit_trajectory
  default_velocity_scaling_factor: 1.0
  default_acceleration_scaling_factor: 1.0
  trajectory_execution:
    allowed_execution_duration_scaling: 1.5
    allowed_goal_duration_margin: 0.5
    allowed_start_tolerance: 0.05
  named_arm_poses:
    zero:
      joint1: 0.0
      joint2: -0.001
      joint3: 0.0
      joint4: 0.0
      joint5: 0.0
      joint6: 0.0
    ready:
      joint1: 0.0
      joint2: -1.0
      joint3: -1.0
      joint4: 0.0
      joint5: 0.0
      joint6: 0.0
    forward:
      joint1: 0.0
      joint2: -1.2
      joint3: -0.8
      joint4: 0.0
      joint5: 0.6
      joint6: 0.0
  kinematics:
    arm:
      kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
      kinematics_solver_search_resolution: 0.005
      kinematics_solver_timeout: 0.05
      kinematics_solver_attempts: 3
      position_only_ik: false
  ompl_planning:
    planning_plugin: ompl_interface/OMPLPlanner
    start_state_max_bounds_error: 0.1
    request_adapters: default_planner_request_adapters/AddTimeOptimalParameterization
      default_planner_request_adapters/ResolveConstraintFrames default_planner_request_adapters/FixWorkspaceBounds
      default_planner_request_adapters/FixStartStateBounds default_planner_request_adapters/FixStartStateCollision
      default_planner_request_adapters/FixStartStatePathConstraints
    planner_configs:
      RRTConnect:
        type: geometric::RRTConnect
        range: 0.0
      RRT:
        type: geometric::RRT
        range: 0.0
        goal_bias: 0.05
      RRTstar:
        type: geometric::RRTstar
        range: 0.0
        goal_bias: 0.05
        delay_collision_checking: 1
      PRM:
        type: geometric::PRM
        max_nearest_neighbors: 10
      EST:
        type: geometric::EST
        range: 0.0
        goal_bias: 0.05
      KPIECE:
        type: geometric::KPIECE
        range: 0.0
        goal_bias: 0.05
        border_fraction: 0.9
        failed_expansion_score_factor: 0.5
        min_valid_path_fraction: 0.5
    arm:
      default_planner_config: RRTConnect
      planner_configs:
