<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B601 · 关节目标控制台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.min.js"}}</script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="app-header">
      <div class="app-title"><p class="model">B601 · MIT</p><h1>关节目标控制台</h1></div>
      <div class="header-status">
        <span id="stiffness" class="stiffness" role="status">刚度待回读</span>
        <span id="connection" class="connection" data-connected="false" role="status">等待连接</span>
      </div>
    </header>
    <div class="workspace">
      <section id="robot-view" class="robot-view" aria-labelledby="robot-title">
        <div class="robot-head">
          <h2 id="robot-title">机械臂视图</h2>
          <div class="view-actions">
            <label><input id="show-robot-target" type="checkbox" checked disabled> 显示目标</label>
            <button id="reset-view" class="quiet" disabled>复位视角</button>
          </div>
        </div>
        <div id="robot-stage" class="robot-stage">
          <span id="model-status" class="model-status" role="status">等待后端发布机械臂模型</span>
          <button type="button" id="tcp-handle" class="tcp-handle" aria-label="TCP 末端目标"
                  aria-pressed="false" aria-describedby="tcp-hint" hidden>TCP</button>
        </div>
        <p id="tcp-hint" class="tcp-hint" role="status">点选 TCP，再按住 Ctrl 拖动</p>
        <div class="pose-summary" aria-label="末端 XYZ，单位米">
          <div><span class="pose-legend actual">实测位置</span><output id="actual-tip">—</output></div>
          <div><span id="model-target-label" class="pose-legend target">关节目标</span><output id="target-tip">—</output></div>
          <small>末端 XYZ / m</small>
        </div>
      </section>
      <section class="controls" aria-labelledby="joints-title">
        <section class="backend-controls" aria-label="后端连接">
          <div class="selection">
            <label for="backend">运行后端</label>
            <select id="backend" disabled>
              <option value="mock">Mock</option>
              <option value="mujoco">MuJoCo</option>
              <option value="dm">实机</option>
            </select>
          </div>
          <div class="authority-actions">
            <button id="connect" disabled>连接</button>
            <button id="disable" class="quiet" disabled>Disable</button>
          </div>
          <div id="mujoco-scene-controls" class="selection" hidden>
            <label for="mujoco-scene">MuJoCo 物理模式</label>
            <select id="mujoco-scene" disabled>
              <option value="free">关闭重力与碰撞</option>
              <option value="physical">开启重力与碰撞</option>
            </select>
          </div>
          <div id="stiffness-switching-controls" class="selection" hidden>
            <label for="stiffness-switching">软硬刚度切换</label>
            <select id="stiffness-switching" disabled>
              <option value="auto">按后端默认</option>
              <option value="true">开启</option>
              <option value="false">关闭（保持高刚度）</option>
            </select>
          </div>
          <p id="backend-feedback" class="backend-feedback" role="status"></p>
          <dl class="compensation-sources">
            <div><dt>重力补偿来源</dt><dd><span id="gravity-source" role="status">待回读</span></dd></div>
            <div><dt>摩擦补偿来源</dt><dd><span id="friction-source" role="status">待回读</span></dd></div>
          </dl>
        </section>
        <section class="authority" aria-label="控制权">
          <div class="selection">
            <label for="input-source">权威输入来源</label>
            <input id="input-source" type="text" list="input-sources" value="web" autocomplete="off" disabled>
            <datalist id="input-sources">
              <option value="web">网页</option>
              <option value="policy">外部策略</option>
              <option value="external">外部接口</option>
            </datalist>
          </div>
          <div class="authority-actions">
            <button id="acquire" disabled>指定控制权</button>
            <button id="release" class="quiet" disabled>释放控制权</button>
          </div>
          <dl class="metrics">
            <div><dt>指定来源</dt><dd id="authority">—</dd></div>
            <div><dt>当前持有者</dt><dd id="source">—</dd></div>
            <div><dt>反馈延迟</dt><dd id="age">—</dd></div>
            <div><dt>最近目标回执</dt><dd id="applied">—</dd></div>
          </dl>
        </section>
        <div class="joint-header">
          <h2 id="joints-title">实测与关节目标</h2>
          <div class="joint-actions">
            <button id="recenter" class="quiet" disabled>一键归中</button>
            <button id="sync" class="quiet" disabled>读入实测</button>
            <button id="send-all" disabled>发送七关节目标</button>
          </div>
        </div>
        <div class="table" id="joints"><p class="placeholder">收到关节列表后可编辑目标。</p></div>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
</body>
</html>
